[package]
name = "starshot-ephemeris"
description = "Planet states from JPL's Table 1, time scales and the DE440 rails reader (D4, D17)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The growth path's stage 3 (D29): nothing but starshot-math, so any producer of a pack
# or an ephemeris can test against this crate without pulling in physics or the game.
[dependencies]
starshot-math = { path = "../starshot-math" }

# float_roundtrip parses JSON numbers correctly rounded, as JavaScript does, so a test
# that reads the Moon rail or a fixture sees the same f64 bits the TypeScript tests see.
[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true
