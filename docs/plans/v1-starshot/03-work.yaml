# Issues as code for the v1-starshot program (D23).
#
# scripts/sync-work.mjs reads this file and creates or updates the labels, the
# milestone, one issue per epic and task, and the sub-issue links, through the GitHub
# REST API. It is a dry run by default; only the orchestrator runs it with --apply,
# never a builder and never CI with a personal token. The issue numbers and REST ids
# it creates are recorded in docs/plans/v1-starshot/work.lock.json, which it writes.
# D23 names the file work.yaml; this program keeps the numbered name 03-work.yaml so the
# plan's files sort in reading order. Titles and bodies pass the copy gate.
#
# Schema (governance research, section D3): each epic has id, title, labels, body and
# tasks; each task has id, title, labels, size, priority, actor, spec, depends_on and a
# short body. Ids are stable slugs and are never reused. A task maps to one pull
# request (PR ids in 00-plan.md), except the owner's tasks in the first epic.

program: v1-starshot
milestone: "Chapter 1: web"

epics:
  - id: v1-governance
    title: "Foundations and governance"
    labels: [kind:epic, area:harness, priority:p1]
    body: |
      The program plan, the decisions D12 to D30, the governance files and gates (PR0),
      and the one-time steps only the owner can take. Done when PR0 has merged and every
      owner task below is closed or explicitly deferred.
      Plan: docs/plans/v1-starshot/00-plan.md. Owner steps: docs/plans/v1-starshot/04-ops-checklist.md.
    tasks:
      - id: v1-pr0-plan
        title: "PR0: program plan, decisions D12 to D30, governance files and gates"
        labels: [kind:docs, area:docs, priority:p1, status:claimed]
        size: XL
        priority: p1
        actor: Agent
        spec: docs/plans/v1-starshot/00-plan.md#what-pr0-carries
        depends_on: []
        body: |
          Lands the plan, the decision entries and the governance scaffolding with every
          gate green. Exceeds the size cap by design (deviation 1).
      - id: v1-ops-github
        title: "Owner: turn on Issues, Actions, Pages, the ruleset and code security"
        labels: [kind:chore, area:ci, priority:p1, status:ready]
        size: S
        priority: p1
        actor: Human
        spec: docs/plans/v1-starshot/04-ops-checklist.md#github
        depends_on: []
        body: |
          Steps G1 to G7 and G10 of the ops checklist. Each step says how to confirm it.
      - id: v1-ops-dco
        title: "Owner: install the DCO app after PR0 merges"
        labels: [kind:chore, area:harness, priority:p1, status:ready]
        size: XS
        priority: p1
        actor: Human
        spec: docs/plans/v1-starshot/04-ops-checklist.md#github
        depends_on: [v1-pr0-plan]
        body: |
          Step G8. From the PR2 group on, the app checks that every commit carries a
          Signed-off-by line matching its author; agent work is authored by the owner (D24).
      - id: v1-ops-board
        title: "Owner: create the project board with its fields and views, and link it"
        labels: [kind:chore, area:harness, priority:p2, status:ready]
        size: S
        priority: p2
        actor: Human
        spec: docs/plans/v1-starshot/04-ops-checklist.md#github
        depends_on: []
        body: |
          Step G9: fields Status, Priority, Size, Area, Actor and Chapter; five views; the
          built-in workflows.
      - id: v1-ops-domain
        title: "Owner: register playstarshot.com and playstarshot.app and forward the project addresses"
        labels: [kind:chore, area:brand, priority:p1, status:ready]
        size: S
        priority: p1
        actor: Human
        spec: docs/plans/v1-starshot/04-ops-checklist.md#domain-and-email
        depends_on: []
        body: |
