program: current-game-release
milestone: "Current game: web"

epics:
  - id: current-game-web
    title: "Publish the current browser game"
    labels: [kind:epic, area:ci, priority:p1]
    body: |
      Publish the existing playable game before the remaining v1 program (D34).
      Scope and acceptance: docs/plans/current-game-release.md.
    tasks:
      - id: early-web-release
        title: "Publish the current game with Firebase Hosting"
        labels: [kind:feature, area:ci, area:game, priority:p1, status:ready, agent-ready]
        size: L
        priority: p1
        actor: Agent
        spec: docs/plans/current-game-release.md
        depends_on: []
        body: |
          Stack a release pull request on PR0. Publish one verified static build to
          playstarshot.com. Use isolated preview Hosting and
          keyless deployment identities. Prove offline startup and coherent updates.
          Keep local saves and label the cloud interaction as a demo. Ship credits.
          Record D34 and the new program trunk sequence without claiming v1 is done.
      - id: versioned-web-releases
        title: "Version game releases and add explicit beta promotion"
        labels: [kind:feature, area:ci, area:harness, area:game, priority:p1, status:ready, agent-ready]
        size: XL
        priority: p1
        actor: Agent
        spec: docs/plans/current-game-release/versioned-releases.md
        depends_on: []
        body: |
          Extend the completed hosting phase with the custom release lane. CI generates semantic versions and
          release notes from Unreleased entries. Publish beta on the isolated dev
          site and promote a tested candidate explicitly from main without rebuilding.
          Preserve keyless identity boundaries, exact artifact provenance and local saves.
          Verify negative release cases, version parity, browser startup and offline play.
