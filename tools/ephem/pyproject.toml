[project]
name = "starshot-ephem"
# PEP 621 needs a version; the tool is never published, so it stays 0.1.0 (AGENTS.md rule 10: never hand-edit a version).
version = "0.1.0"
description = "Starshot's ephemeris tool: Horizons test fixtures, the DE440 kernel and the rails pack"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "jplephem==2.24",
    "numpy==2.5.4",
]

[project.scripts]
starshot-ephem = "ephem.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

# The import package is `ephem`. PyEphem uses the same name; this project never installs it.
[tool.uv.build-backend]
module-name = "ephem"

[tool.pytest.ini_options]
testpaths = ["tests"]
# No .pytest_cache in the tree: the tests write nothing outside pytest's tmp_path.
addopts = "-p no:cacheprovider"
