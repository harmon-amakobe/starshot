# Licensing record for every file, in the REUSE 3.3 format (https://reuse.software/spec-3.3/).
# When several annotations match a file, the last one wins, so the catch-all comes first.
# scripts/check-licence.mjs reads this file (D12).
version = 1

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Harmon Amakobe and Starshot contributors"
SPDX-License-Identifier = "Apache-2.0"

# Original art and audio (D12, D15). Each file also needs an entry in
# apps/game/assets/manifest.json (check-assets.mjs), from which CREDITS.md is generated.
[[annotations]]
path = ["apps/game/public/art/**", "apps/game/public/audio/**"]
SPDX-FileCopyrightText = "Starshot contributors; third-party sources as listed in CREDITS.md"
SPDX-License-Identifier = "CC-BY-4.0"

# The name, logo and icon: all rights reserved, uses set out in TRADEMARK.md (D12, D20).
[[annotations]]
path = ["apps/game/public/brand/**", "apps/game/public/icon.svg"]
SPDX-FileCopyrightText = "2026 Harmon Amakobe"
SPDX-License-Identifier = "LicenseRef-starshot-brand"

[[annotations]]
path = "apps/game/public/brand/README.md"
SPDX-FileCopyrightText = "2026 Harmon Amakobe and Starshot contributors"
SPDX-License-Identifier = "Apache-2.0"

# Mark Macharia's astlo: his terms, never relicensed here (D2, D10). Mark's own headers
# stay authoritative inside his files, so this table never overrides them.
[[annotations]]
path = ["third_party/astlo/**", "python/astlo/astlo/**", "python/astlo/astlo-*.dist-info/**"]
SPDX-FileCopyrightText = "Mark Macharia"
SPDX-License-Identifier = "LicenseRef-astlo"

# The code of conduct adapts Contributor Covenant 3.0, which its authors publish under
# CC BY-SA 4.0; the adaptation is Starshot's.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
SPDX-FileCopyrightText = "Organization for Ethical Source (Contributor Covenant 3.0); adaptation 2026 Harmon Amakobe and Starshot contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# NASA/JPL data used as test fixtures and reference values (D17): Horizons responses and
# values derived from DE440. The files are data, credited in CREDITS.md.
[[annotations]]
path = ["packages/ephemeris/test/fixtures/**", "python/astlo/tests/fixtures/**", "tools/ephem/tests/data/**"]
SPDX-FileCopyrightText = "NASA/JPL-Caltech (data); file assembled by Starshot contributors"
SPDX-License-Identifier = "LicenseRef-NASA-JPL-Data"

[[annotations]]
path = ["apps/prototype/public/observatory/*-1k.jpg"]
SPDX-FileCopyrightText = "Solar System Scope / INOVE"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "apps/prototype/public/observatory/moon-1k.jpg"
SPDX-FileCopyrightText = "NASA's Scientific Visualization Studio / LRO / LROC"
SPDX-License-Identifier = "LicenseRef-NASA-Media"

[[annotations]]
path = "apps/prototype/public/observatory/*.woff2"
SPDX-FileCopyrightText = "2017 IBM Corp. Reserved Font Name Plex"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["apps/prototype/public/observatory/satellite-data.json", "apps/prototype/public/observatory/satellite-states.bin", "apps/prototype/public/observatory/system-orientation.json", "apps/prototype/tools/fixtures/orientation-reference.json", "apps/prototype/tools/fixtures/provenance/**"]
SPDX-FileCopyrightText = "NASA/JPL-Caltech (data); assembled and last modified by starshot contributors"
SPDX-License-Identifier = "LicenseRef-NASA-JPL-Data"

[[annotations]]
path = "apps/prototype/public/observatory/system-icons.js"
SPDX-FileCopyrightText = "2026 Lucide Icons and Contributors; 2013-present Cole Bemis; adaptations by starshot contributors"
SPDX-License-Identifier = "LicenseRef-Lucide-Feather"

[[annotations]]
path = "packages/ephemeris/data/moon-rail.json"
SPDX-FileCopyrightText = "NASA/JPL-Caltech (data); assembled and last modified by starshot contributors"
SPDX-License-Identifier = "LicenseRef-NASA-JPL-Data"

# The DE440 rails pack: derived from NAIF's de440s.bsp by tools/ephem, which NAIF's rules
# ask to name as the last modifier (D17). Its README is Starshot's own prose.
[[annotations]]
path = "data/ephem/**"
SPDX-FileCopyrightText = "NASA/JPL-Caltech (data); derived and last modified by Starshot contributors"
SPDX-License-Identifier = "LicenseRef-NASA-JPL-Data"

[[annotations]]
path = "data/ephem/README.md"
SPDX-FileCopyrightText = "2026 Harmon Amakobe and Starshot contributors"
SPDX-License-Identifier = "Apache-2.0"
