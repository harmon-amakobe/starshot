# CI: the gate registry on every pull request and on main. It needs no secrets; one
# optional secret only widens the hygiene scan.
# Actions are disabled by default on forks; docs/hosting.md says how to enable them and
# how to make this check required on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: the copy gate reads the pull request's commit messages and the
          # size gate compares its baseline with the base branch (D27, D28).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Optional: the owner's private-name list, comma-separated (docs/hosting.md). Run
      # before npm ci, so no third-party package shares a step with it. Forks and pull
      # requests from forks get no secrets; the scan then says its name rule is off.
      - name: Secrets gate with the private-name list
        run: node scripts/gates.mjs --only secrets
        env:
          STARSHOT_PRIVATE_NAMES: ${{ secrets.STARSHOT_PRIVATE_NAMES }}
      - run: npm ci
      - run: npm run gates
