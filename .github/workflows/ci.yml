# CI: the gate registry on every pull request and on main. It needs no secrets; one
# optional secret only widens the hygiene scan.
# Actions are disabled by default on forks; docs/hosting.md says how to enable them and
# how to make this check required on main.
# The required check is the gates job at the end. It stays one name however many jobs
# feed it, so branch protection never has to change when CI grows.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for what its steps need.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # The Rust gates fail here when cargo is missing, instead of skipping (scripts/gates.mjs).
    env:
      STARSHOT_REQUIRE_RUST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the copy gate reads the pull request's commit messages and the
          # size gate compares its baseline with the base branch (D27, D28).
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Optional: the owner's private-name list, comma-separated (docs/hosting.md). Run
      # before npm ci, so no third-party package shares a step with it; the commits gate
      # needs only git and node, so it reads the list here too. Forks and pull requests
      # from forks get no secrets; each scan then says its name rule is off.
      - name: Secrets and commits gates with the private-name list
        run: node scripts/gates.mjs --only secrets,commits
        env:
          STARSHOT_PRIVATE_NAMES: ${{ secrets.STARSHOT_PRIVATE_NAMES }} # zizmor: ignore[secrets-outside-env] one step reads it, before npm ci (see above)
      - run: npm ci
      # Nothing builds wasm until PR15, so this job skips wasm-bindgen-cli too.
      - uses: $/.github/actions/setup-rust-wasm
        with:
          wasm-bindgen: "false"
      - run: npm run gates

  # The maths golden file on arm64: the first measurement that phones and the x86_64
  # checks job give the same bits (D16, AC6).
  rust-arm64:
    name: rust-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust-wasm
        with:
          wasm-bindgen: "false"
      - run: cargo test --workspace --locked

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Offline: the audits that call the GitHub API would need a token, and the pinned
      # version keeps a new zizmor rule from failing an unrelated pull request.
      - run: pipx run zizmor==1.31.1 --offline .github/

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # The job always runs, so the aggregator can treat any skipped job as a failure. Its
    # steps compare the pull request's dependencies with its base; a push has no base, so
    # on a push they skip and the job passes.
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  pr-size:
    name: pr-size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # Always runs, like dependency-review, so a skipped job still fails the aggregator
    # (deviation 12). A push has no base to measure against, so its steps skip and the
    # job passes. The script needs only git and Node's standard library, so it runs on
    # the runner's own Node without setup-node or npm ci.
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the size is measured from the merge base with the base branch.
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        name: Size against the group cap (D30)
        # The base is fetched by name first, so the size never depends on which refs the
        # checkout brought along, as for a pull request from a fork. A fork chooses its
        # own branch name, so it could borrow a group's row: it always counts 1 member.
        env:
          # A deleted head repository reads as a fork, the safe side.
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          if [ "$HEAD_IS_FORK" = "true" ]; then set -- --members 1; fi
          node scripts/check-pr-size.mjs --base "origin/${GITHUB_BASE_REF}" "$@"

  verify-game:
    name: verify-game
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PLAYWRIGHT_VERSION: "1.64.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Playwright is not a project dependency, so it never enters package.json or the
      # lockfile. A global install at a pinned version keeps CI reproducible, and
      # NODE_PATH lets the script's require("playwright") find it.
      - name: Install Playwright outside the project
        run: | # zizmor: ignore[adhoc-packages] kept out of the lockfile on purpose, see above
          npm install --global "playwright@${PLAYWRIGHT_VERSION}"
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - run: playwright install --with-deps chromium
      - run: node scripts/verify-game.mjs --out "$RUNNER_TEMP/verify-game"
      - run: node scripts/verify-game.mjs --base /starshot/ --out "$RUNNER_TEMP/verify-subpath"
      - run: node scripts/verify-web-release.mjs --out "$RUNNER_TEMP/verify-offline"
      # Kept on failure too: the screenshots are how a red run gets diagnosed.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-game-screenshots
          path: |
            ${{ runner.temp }}/verify-game
            ${{ runner.temp }}/verify-subpath
            ${{ runner.temp }}/verify-offline
          retention-days: 7

  gates:
    name: gates
    # always(): without it a failed need skips this job, and a skipped required check
    # counts as passing. No need has a job-level condition, so a skipped need means
    # something hid a check: that fails too. A job added later keeps to the same rule.
    if: always()
    needs: [checks, rust-arm64, workflow-lint, dependency-review, pr-size, verify-game]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any needed job failed, was cancelled or was skipped
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
