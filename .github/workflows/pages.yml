# Deploys the game to GitHub Pages from main. Fully static: no backend, no secrets in the
# build (D7); the one optional secret is read by the hygiene scan step alone.
# Requires Settings > Pages > Source: GitHub Actions on this repository (docs/hosting.md).
# The site is served under /<repository>/. The game's Vite config sets base "./", so every
# asset URL is relative and the same build works under any path; no prefix is passed in.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for what its steps need.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: a published build must never restore a cache that another run,
      # perhaps a pull request's, could have written.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run gates
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/game/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the uploaded artifact to GitHub Pages
      id-token: write # the OIDC token deploy-pages uses to prove the run to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
