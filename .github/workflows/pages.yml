# Deploys the game to GitHub Pages from main. Fully static: no backend, no secrets in the
# build (D7); the one optional secret is read by the hygiene scan step alone.
# Requires Settings > Pages > Source: GitHub Actions on this repository (docs/hosting.md).
# The site is served under /<repository>/. The game's Vite config sets base "./", so every
# asset URL is relative and the same build works under any path; no prefix is passed in.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run gates
      - uses: actions/configure-pages@v6
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
