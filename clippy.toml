# Transcendental methods on f64 and f32 differ in the last bit between platforms and
# runtimes, and mul_add fuses a rounding away. The only way to them is starshot_math,
# which wraps the libm crate so every runtime gives identical bits (D16).
disallowed-methods = [
  { path = "f64::sin", reason = "use starshot_math (D16: identical bits on every runtime)" },
  { path = "f64::cos", reason = "use starshot_math (D16: identical bits on every runtime)" },
  { path = "f64::tan", reason = "use starshot_math (D16: identical bits on every runtime)" },
